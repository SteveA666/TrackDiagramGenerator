name: Portable applications

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Build Windows portable EXE and universal JAR
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-portable.ps1
      - name: Build Linux or macOS portable application
        if: runner.os != 'Windows'
        shell: bash
        run: bash packaging/build-portable.sh
      - name: Build Windows MSI installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build-msi.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: portable-${{ runner.os }}-${{ runner.arch }}
          path: target/releases/*
          if-no-files-found: error
